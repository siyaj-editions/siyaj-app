; Limites d'upload PHP-FPM pour l'image Docker (copié dans /usr/local/etc/php/conf.d/ par le Dockerfile).
;
; L'image php:*-fpm-alpine n'active aucun php.ini : PHP reste sur ses valeurs par défaut
; (upload_max_filesize = 2M, post_max_size = 8M), ce qui rejette les manuscrits PDF
; que le formulaire autorise pourtant jusqu'à 20 Mo (src/Form/ManuscriptSubmissionType.php).
;
; Doit rester cohérent avec :
; - php.ini (racine du projet, serveur local Symfony)
; - deploy/nginx/default.conf (client_max_body_size)
upload_max_filesize = 25M
post_max_size = 30M
