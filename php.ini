; Surcharge PHP pour le serveur local Symfony (`symfony serve` / `make serve`).
; Le Symfony CLI lit automatiquement ce fichier et l'applique par-dessus le php.ini système.
;
; Le formulaire de soumission de manuscrit accepte des PDF jusqu'à 20 Mo
; (src/Form/ManuscriptSubmissionType.php) et les couvertures admin jusqu'à 8 Mo
; (src/Form/BookFormType.php). Sans ces valeurs, PHP bloque à 2 Mo (défaut)
; avant même que les contraintes Symfony ne s'appliquent.
;
; Même réglage pour l'image Docker : deploy/php/uploads.ini
upload_max_filesize = 25M
post_max_size = 30M
